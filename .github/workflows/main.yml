name: generate-doc 
on:
  push:
    branches:
      - main 
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      # If figures lose their images: mkdocs-glightbox wraps images via selectolax,
      # and selectolax 1.0.1 (Oct 2026) broke that. Fixed in 1.0.2. If it recurs,
      # exclude the bad release here, e.g.: pip install ... "selectolax!=<bad version>"
      - run: pip install mkdocs-material mkdocs-glightbox
      - working-directory: .
        run: mkdocs gh-deploy --force
